<div class="glass-panel p-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h5 class="text-white fw-light tracking-wide mb-0">
      <i class="bi bi-people-fill me-2"></i> Gestión Administrativa de Estudiantes
    </h5>
  </div>

  <!-- Buscador Superior -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="input-group">
        <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control glass-input text-white" 
               placeholder="Buscar por código, nombre o apellido..." 
               [(ngModel)]="filtroBusqueda" (keyup.enter)="buscar()">
        <button class="btn btn-primary glass-btn" (click)="buscar()">Filtrar</button>
      </div>
    </div>
  </div>

  <!-- Estado de Carga -->
  <div *ngIf="cargando" class="text-center py-4">
    <div class="spinner-border text-info mb-3" role="status"></div>
  </div>

  <!-- Tabla  -->
  <div class="table-responsive" *ngIf="!cargando">
    <table class="table glass-table text-white mb-0 align-middle">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre Completo</th>
          <th>Estado Actual</th>
          <th class="text-center">Acciones Críticas</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="listaEstudiantes.length === 0">
          <td colspan="4" class="text-center text-white-50 py-4">No se encontraron estudiantes.</td>
        </tr>
        <tr *ngFor="let est of listaEstudiantes">
          <td class="small text-white-50">{{ est.codigoPersonal }}</td>
          <td class="fw-bold">{{ est.nombres }} {{ est.apellidos }}</td>
          <td>
            <span class="badge" 
                  [ngClass]="{'bg-success': est.estado === 'ACTIVO', 'bg-secondary': est.estado === 'INACTIVO', 'bg-info': est.estado === 'GRADUADO'}">
              {{ est.estado }}
            </span>
          </td>
          <td class="text-center">
            
            <button class="btn btn-sm glass-btn-action text-success me-2" (click)="generarCredenciales(est)" title="Generar Correo Institucional">
              <i class="bi bi-key-fill"></i> Acceso
            </button>
            
            <div class="dropdown d-inline-block">
              <button class="btn btn-sm glass-btn-action text-warning dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Cambiar Estado">
                Estado
              </button>
              <ul class="dropdown-menu dropdown-menu-dark glass-panel">
                <li><a class="dropdown-item" href="javascript:void(0)" (click)="cambiarEstado(est.codigoPersonal, 'ACTIVO')">Marcar Activo</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)" (click)="cambiarEstado(est.codigoPersonal, 'INACTIVO')">Dar de Baja</a></li>
                <li><a class="dropdown-item" href="javascript:void(0)" (click)="cambiarEstado(est.codigoPersonal, 'GRADUADO')">Graduar</a></li>
              </ul>
            </div>

          </td>
        </tr>
      </tbody>
    </table>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" (click)="cambiarPagina(-1)" [disabled]="paginaActual === 1">
        <i class="bi bi-chevron-left"></i> Anterior
      </button>
      <span class="text-white-50 small">Página {{ paginaActual }}</span>
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" (click)="cambiarPagina(1)" [disabled]="listaEstudiantes.length < limitePorPagina">
        Siguiente <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
