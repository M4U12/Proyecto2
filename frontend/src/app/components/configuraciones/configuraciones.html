<div class="glass-panel p-4 mb-4">
  <h4 class="text-white fw-light tracking-wide mb-4">
    <i class="bi bi-gear me-2 text-warning"></i> Parámetros Globales del Sistema
  </h4>
  <p class="text-white-50 small mb-4">
    Modifica las tarifas y configuraciones globales.
  </p>

  <div *ngIf="cargando" class="text-center py-4">
    <div class="spinner-border text-warning" role="status"></div>
  </div>

  <div *ngIf="!cargando" class="row g-4">
    <div class="col-md-6" *ngFor="let config of configuraciones">
      <div class="p-4 bg-dark bg-opacity-50 rounded border border-secondary h-100">
        <h6 class="text-info mb-2 fw-bold tracking-wide">{{ config.clave }}</h6>
        <p class="text-white-50 small mb-4" style="min-height: 40px;">{{ config.descripcion }}</p>
        
        <label class="form-label text-white small">Valor Asignado (Q)</label>
        <div class="input-group mb-3">
          <span class="input-group-text bg-transparent border-secondary text-white-50">Q</span>
          <input type="number" class="form-control glass-input text-white fs-5 fw-bold" 
                 [(ngModel)]="config.valor" min="0" step="1">
        </div>
        
        <div class="text-end">
          <button class="btn btn-warning rounded-pill px-4 shadow" (click)="guardarCambio(config)">
            <i class="bi bi-save me-1"></i> Guardar Cambios
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
