<div class="glass-panel p-4 mb-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="text-white fw-light tracking-wide mb-0">
      <i class="bi bi-bookshelf me-2"></i> Biblioteca Virtual
    </h4>
  </div>

  <!-- Buscador -->
  <div class="input-group mb-5 shadow-sm">
    <span class="input-group-text bg-transparent border-info text-info"><i class="bi bi-search"></i></span>
    <input type="text" class="form-control glass-input text-white border-info fs-5 py-2" 
           placeholder="Buscar el título, autor o código del libro que necesitas..." 
           [(ngModel)]="filtroBusqueda" (keyup.enter)="buscar()">
    <button class="btn btn-info text-dark fw-bold px-4" (click)="buscar()">Buscar</button>
  </div>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-info" style="width: 3rem; height: 3rem;" role="status"></div>
    <div class="text-white-50 mt-3">Cargando estanterías...</div>
  </div>

  <!-- Cuadrícula de Libros -->
  <div class="row g-4" *ngIf="!cargando">
    <div class="col-12 text-center text-white-50 py-5" *ngIf="listaLibros.length === 0">
      <i class="bi bi-journal-x fs-1 mb-3 d-block"></i>
      No encontramos libros que coincidan con tu búsqueda.
    </div>

    <!-- Tarjeta de Libro -->
    <div class="col-sm-6 col-md-4 col-lg-3" *ngFor="let libro of listaLibros">
      <div class="card bg-dark bg-opacity-50 border border-secondary h-100 shadow-sm text-white glass-table">
        
        <!-- Contenedor de Portada -->
        <div class="position-relative text-center pt-3" style="height: 220px;">
          <img *ngIf="libro.imagen" [src]="libro.imagen" class="object-fit-cover shadow rounded" style="width: 140px; height: 200px;" alt="Portada">
          <div *ngIf="!libro.imagen" class="bg-secondary bg-opacity-25 rounded d-flex flex-column align-items-center justify-content-center mx-auto border border-secondary" style="width: 140px; height: 200px;">
            <i class="bi bi-image fs-1 text-white-50"></i>
          </div>
          
          <!-- Badge de disponibilidad -->
          <span class="position-absolute top-0 end-0 mt-3 me-3 badge rounded-pill" 
                [ngClass]="libro.copiasDisponibles > 0 ? 'bg-success' : 'bg-danger'">
            {{ libro.copiasDisponibles > 0 ? 'Disponible' : 'Agotado' }}
          </span>
        </div>

        <div class="card-body d-flex flex-column">
          <div class="small text-info fw-bold mb-1">{{ libro.codigo }}</div>
          <h6 class="card-title fw-bold text-truncate" [title]="libro.titulo">{{ libro.titulo }}</h6>
          <p class="card-text small text-white-50 mb-3">{{ libro.autor }}</p>
          
          <div class="mt-auto d-grid">
            <button class="btn btn-outline-info rounded-pill fw-bold" 
                    [disabled]="libro.copiasDisponibles <= 0" 
                    (click)="solicitarLibro(libro)">
              <i class="bi" [ngClass]="libro.copiasDisponibles > 0 ? 'bi-journal-plus' : 'bi-slash-circle'"></i>
              {{ libro.copiasDisponibles > 0 ? ' Solicitar Préstamo' : ' Sin Copias' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Paginación -->
  <div class="d-flex justify-content-between align-items-center mt-4 border-top border-secondary pt-3" *ngIf="!cargando && listaLibros.length > 0">
    <button class="btn btn-outline-secondary rounded-pill px-4" (click)="cambiarPagina(-1)" [disabled]="paginaActual === 1">
      <i class="bi bi-chevron-left me-1"></i> Anterior
    </button>
    <span class="text-white-50">Página {{ paginaActual }}</span>
    <button class="btn btn-outline-secondary rounded-pill px-4" (click)="cambiarPagina(1)" [disabled]="listaLibros.length < limitePorPagina">
      Siguiente <i class="bi bi-chevron-right ms-1"></i>
    </button>
  </div>
</div>
