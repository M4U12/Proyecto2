<div class="row g-4">
  
  <!-- Datos del Perfil -->
  <div class="col-md-5">
    <div class="glass-panel p-4 h-100">
      
      <div class="text-center mb-4 border-bottom border-secondary pb-4">
        <div class="avatar-circle mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
          <i class="bi bi-person text-white"></i>
        </div>
        <h5 class="text-white m-0">{{ nombreActual }}</h5> 
        <span class="badge bg-info text-dark mt-2">{{ rolUsuario }}</span>
      </div>

      <div class="mb-4">
        <label class="text-white-50 small mb-1">Correo Institucional</label>
        <div class="input-group">
          <span class="input-group-text bg-dark border-secondary text-white-50">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control glass-input text-white-50 bg-dark bg-opacity-25" 
                 [value]="correoActual" readonly style="cursor: not-allowed;">
        </div>
      </div>

    </div>
  </div>

  <!-- Cambio de Contraseña -->
  <div class="col-md-7">
    <div class="glass-panel p-4 h-100">
      
      <h5 class="text-white fw-light mb-4">
        <i class="bi bi-shield-lock me-2"></i> Seguridad de la Cuenta
      </h5>
      
      <div class="alert bg-dark bg-opacity-50 border-secondary text-white-50 small mb-4">
        Si recibiste una contraseña temporal, usa este formulario para establecer una clave segura que solo tú conozcas.
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="cambiarPassword()">
        
        <div class="mb-4">
          <label class="text-white-50 small mb-1">Contraseña Actual</label>
          <input type="password" class="form-control glass-input text-white" formControlName="passwordActual" placeholder="••••••••">
        </div>
        
        <div class="mb-4">
          <label class="text-white-50 small mb-1">Nueva Contraseña</label>
          <input type="password" class="form-control glass-input text-white" formControlName="passwordNueva" placeholder="•••••••• (Mínimo 5 caracteres)">
        </div>
        
        <div class="text-end border-top border-secondary pt-3">
          <button type="submit" class="btn btn-warning glass-btn rounded-pill px-4 tracking-wide text-dark" [disabled]="passwordForm.invalid">
            CAMBIAR CONTRASEÑA
          </button>
        </div>
      </form>

    </div>
  </div>

</div>
