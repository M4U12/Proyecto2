<!-- FORMULARIO DE REGISTRO  -->
<div class="glass-panel p-4 mb-4">
  <h4 class="text-white fw-light tracking-wide mb-4">
    <i class="bi bi-journal-bookmark-fill me-2"></i> Registrar Nuevo Curso
  </h4>
  
  <form class="row g-3" [formGroup]="cursoForm" (ngSubmit)="guardarCurso()">
    
    <div class="col-md-4">
      <label class="text-white-50 small mb-1">Código del Curso</label>
      <input type="text" class="form-control glass-input text-white" formControlName="codigo" placeholder="Ej. MAT-101">
    </div>
    
    <div class="col-md-8">
      <label class="text-white-50 small mb-1">Nombre Oficial de la Materia</label>
      <input type="text" class="form-control glass-input text-white" formControlName="nombre" placeholder="Ej. Matemáticas I">
    </div>
    
    <div class="col-12 text-end mt-4">
      <button type="submit" class="btn btn-primary glass-btn rounded-pill px-4 tracking-wide" [disabled]="cursoForm.invalid">
        GUARDAR CURSO
      </button>
    </div>
  </form>
</div>

<!-- TABLA DEL CATÁLOGO DE CURSOS -->
<div class="glass-panel p-4">
  <h5 class="text-white fw-light tracking-wide mb-4"><i class="bi bi-card-list me-2"></i>Catálogo General de Cursos</h5>
  <div class="table-responsive">
    <table class="table glass-table text-white">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre del Curso</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="listaCursos.length === 0">
          <td colspan="4" class="text-center text-white-50 py-3">No hay cursos registrados.</td>
        </tr>

        <tr *ngFor="let curso of listaCursos">
          <td><span class="badge text-white border border-secondary">{{ curso.codigo }}</span></td>
          <td>{{ curso.nombre }}</td>
          <td>
            <span class="badge bg-opacity-75" [ngClass]="{'bg-success': curso.estado, 'bg-danger': !curso.estado}">
              {{ curso.estado ? 'ACTIVO' : 'INACTIVO' }}
            </span>
          </td>
          <td>
            <!-- Botón Editar -->
            <button class="btn btn-sm glass-btn-action text-info me-2" title="Editar Curso" 
                    data-bs-toggle="modal" data-bs-target="#modalEditarCurso" (click)="abrirModalEdicion(curso)">
              <i class="bi bi-pencil"></i>
            </button>

            <!-- Botones de estado -->
            <button *ngIf="!curso.estado" (click)="cambiarEstado(curso.idCurso, curso.estado)" 
              class="btn btn-sm glass-btn-action text-success me-2" title="Activar">
              <i class="bi bi-check-circle"></i>
            </button>
            
            <button *ngIf="curso.estado" (click)="cambiarEstado(curso.idCurso, curso.estado)" 
              class="btn btn-sm glass-btn-action text-danger" title="Desactivar">
              <i class="bi bi-x-circle"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <!-- CONTROLES DE PAGINACIÓN -->
    <div class="d-flex justify-content-between align-items-center mt-4">
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-4" 
              (click)="cambiarPagina(-1)" [disabled]="paginaActual === 1">
        <i class="bi bi-chevron-left me-1"></i> Anterior
      </button>
      
      <span class="text-white-50 small">Página {{ paginaActual }}</span>
      
      <!-- Se deshabilita si la lista trae menos del límite (significa que es la ultima página) -->
      <button class="btn btn-outline-secondary btn-sm rounded-pill px-4" 
              (click)="cambiarPagina(1)" [disabled]="listaCursos.length < limitePorPagina">
        Siguiente <i class="bi bi-chevron-right ms-1"></i>
      </button>
    </div>
  </div>
</div>

<!-- MODAL DE EDICIÓN -->
<div class="modal fade" id="modalEditarCurso" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-panel border-0">
      
      <div class="modal-header border-secondary text-white">
        <h5 class="modal-title fw-light"><i class="bi bi-pencil-square me-2"></i>Editar Datos del Curso</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body p-4">
        <form class="row g-3" [formGroup]="cursoEditForm">
          
          <div class="col-12">
            <label class="text-white-50 small mb-1">Código del Curso</label>
            <input type="text" class="form-control glass-input text-white" formControlName="codigo">
          </div>
          
          <div class="col-12 mt-3">
            <label class="text-white-50 small mb-1">Nombre Oficial</label>
            <input type="text" class="form-control glass-input text-white" formControlName="nombre">
          </div>
        </form>
      </div>
      
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button type="button" class="btn btn-primary glass-btn rounded-pill px-4" 
                data-bs-dismiss="modal" (click)="actualizarCurso()" [disabled]="cursoEditForm.invalid">
          Guardar Cambios
        </button>
      </div>
      
    </div>
  </div>
</div>
